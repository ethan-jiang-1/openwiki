<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#f8f9fa" rx="8"/>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Code Mode：为代码仓库生成文档 Wiki</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#888">openwiki code · openwiki --init · openwiki --update</text>

  <!-- Step 1: Git Repo -->
  <rect x="50" y="70" width="200" height="70" rx="10" fill="#2d6a4f" filter="url(#shadow)"/>
  <text x="150" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">① Git 仓库</text>
  <text x="150" y="115" text-anchor="middle" font-size="10" fill="#a0d0b0">源码 + Git 历史</text>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="#a0d0b0">git log / status / diff</text>

  <!-- Step 2: Git Evidence -->
  <rect x="300" y="70" width="200" height="70" rx="10" fill="#1a5a3a" filter="url(#shadow)"/>
  <text x="400" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">② Git 证据收集</text>
  <text x="400" y="115" text-anchor="middle" font-size="10" fill="#a0d0b0">agent/utils.ts</text>
  <text x="400" y="130" text-anchor="middle" font-size="10" fill="#a0d0b0">最近 20 条 commit + diff</text>

  <!-- Step 3: Content Snapshot -->
  <rect x="550" y="70" width="200" height="70" rx="10" fill="#1a3a2a" filter="url(#shadow)"/>
  <text x="650" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">③ 内容快照 (SHA-256)</text>
  <text x="650" y="115" text-anchor="middle" font-size="10" fill="#a0d0b0">记录 openwiki/ 当前状态</text>
  <text x="650" y="130" text-anchor="middle" font-size="10" fill="#a0d0b0">排除 .last-update.json</text>

  <!-- arrows between steps -->
  <line x1="250" y1="105" x2="298" y2="105" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="105" x2="548" y2="105" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent Box -->
  <rect x="150" y="175" width="500" height="130" rx="14" fill="#0f3460" filter="url(#shadow)"/>
  <text x="400" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">④ 文档 Agent 运行</text>
  <text x="400" y="222" text-anchor="middle" font-size="10" fill="#aac">加载 .env → 解析 provider → 创建模型 → 构建提示词 → 流式执行</text>

  <!-- internal sub-boxes -->
  <rect x="175" y="236" width="140" height="30" rx="6" fill="#1a4a80"/>
  <text x="245" y="255" text-anchor="middle" font-size="10" fill="#eef">System Prompt</text>
  <rect x="330" y="236" width="140" height="30" rx="6" fill="#1a4a80"/>
  <text x="400" y="255" text-anchor="middle" font-size="10" fill="#eef">Model Client</text>
  <rect x="485" y="236" width="140" height="30" rx="6" fill="#1a4a80"/>
  <text x="555" y="255" text-anchor="middle" font-size="10" fill="#eef">DeepAgents</text>

  <rect x="175" y="272" width="450" height="20" rx="4" fill="#1a3a60"/>
  <text x="400" y="286" text-anchor="middle" font-size="9" fill="#88aacc">限制写入 openwiki/ 目录 · 只读沙箱 · SQLite checkpointer · 120 秒超时</text>

  <!-- arrow from snapshot to agent -->
  <line x1="650" y1="140" x2="550" y2="173" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Post-run snapshot -->
  <rect x="50" y="340" width="220" height="60" rx="10" fill="#1a3a2a" filter="url(#shadow)"/>
  <text x="160" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">⑤ 后快照对比</text>
  <text x="160" y="383" text-anchor="middle" font-size="10" fill="#a0d0b0">前 SHA-256 vs 后 SHA-256</text>
  <text x="160" y="396" text-anchor="middle" font-size="10" fill="#a0d0b0">内容不变 → 不写元数据</text>

  <!-- Step 6: Output -->
  <rect x="320" y="340" width="200" height="60" rx="10" fill="#333" filter="url(#shadow)"/>
  <text x="420" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#ddd">⑥ 输出</text>
  <text x="420" y="383" text-anchor="middle" font-size="10" fill="#aaa">openwiki/</text>
  <text x="420" y="396" text-anchor="middle" font-size="10" fill="#aaa">结构化的 Markdown 文档</text>

  <!-- Step 7: CI -->
  <rect x="570" y="340" width="180" height="60" rx="10" fill="#444" filter="url(#shadow)"/>
  <text x="660" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#ddd">⑦ CI/CD 集成</text>
  <text x="660" y="383" text-anchor="middle" font-size="10" fill="#aaa">GitHub Actions</text>
  <text x="660" y="396" text-anchor="middle" font-size="10" fill="#aaa">定时自动更新</text>

  <!-- arrows -->
  <line x1="300" y1="305" x2="270" y2="338" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="305" x2="450" y2="338" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 防重写说明 -->
  <rect x="130" y="425" width="540" height="48" rx="14" fill="#fff3cd" stroke="#f0c000" stroke-width="1"/>
  <text x="400" y="445" text-anchor="middle" font-size="10" font-weight="700" fill="#856404">关键机制：内容快照防重写</text>
  <text x="400" y="462" text-anchor="middle" font-size="9" fill="#856404">文档没有实质变化就不更新 .last-update.json，防止 CI 死循环</text>

  <text x="400" y="495" text-anchor="middle" font-size="9" fill="#bbb">Code mode 也写 AGENTS.md / CLAUDE.md 片段，让 AI 助手自动发现 openwiki/ 文档</text>
</svg>
