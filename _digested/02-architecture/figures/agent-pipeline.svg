<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f3460"/>
    </marker>
  </defs>
  <rect width="820" height="680" fill="#f8f9fa" rx="8"/>

  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Agent 内部：10 步文档生成流水线</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#888">src/agent/index.ts — runOpenWikiAgent()</text>

  <!-- Step boxes in a snake layout -->
  <!-- Row 1: Steps 1-4 -->
  <!-- Step 1 -->
  <rect x="20" y="65" width="180" height="68" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="#1976d2">① 加载环境</text>
  <text x="110" y="105" text-anchor="middle" font-size="9" fill="#555">loadOpenWikiEnv()</text>
  <text x="110" y="120" text-anchor="middle" font-size="9" fill="#555">从 ~/.openwiki/.env</text>
  <text x="110" y="133" text-anchor="middle" font-size="9" fill="#555">读入 process.env</text>

  <!-- Step 2 -->
  <rect x="220" y="65" width="180" height="68" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="#388e3c">② 解析 Provider</text>
  <text x="310" y="105" text-anchor="middle" font-size="9" fill="#555">resolveConfiguredProvider()</text>
  <text x="310" y="120" text-anchor="middle" font-size="9" fill="#555">OPENWIKI_PROVIDER env</text>
  <text x="310" y="133" text-anchor="middle" font-size="9" fill="#555">→ 首个有 Key 的 → 默认</text>

  <!-- Step 3 -->
  <rect x="420" y="65" width="180" height="68" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="#f57c00">③ 解析 Model ID</text>
  <text x="510" y="105" text-anchor="middle" font-size="9" fill="#555">CLI 参数</text>
  <text x="510" y="120" text-anchor="middle" font-size="9" fill="#555">→ OPENWIKI_MODEL_ID</text>
  <text x="510" y="133" text-anchor="middle" font-size="9" fill="#555">→ 提供商默认模型</text>

  <!-- Step 4 -->
  <rect x="620" y="65" width="180" height="68" rx="10" fill="#fce4ec" stroke="#d32f2f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="#d32f2f">④ 构建 RunContext</text>
  <text x="710" y="105" text-anchor="middle" font-size="9" fill="#555">createRunContext()</text>
  <text x="710" y="120" text-anchor="middle" font-size="9" fill="#555">Git status/log/diff</text>
  <text x="710" y="133" text-anchor="middle" font-size="9" fill="#555">+ 上次 .last-update.json</text>

  <!-- arrows row 1 -->
  <line x1="200" y1="99" x2="218" y2="99" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="99" x2="418" y2="99" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="99" x2="618" y2="99" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: Steps 5-8 -->
  <!-- Step 5 -->
  <rect x="20" y="158" width="180" height="68" rx="10" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#3f51b5">⑤ 内容快照</text>
  <text x="110" y="198" text-anchor="middle" font-size="9" fill="#555">createOpenWikiContent</text>
  <text x="110" y="213" text-anchor="middle" font-size="9" fill="#555">Snapshot() SHA-256</text>
  <text x="110" y="226" text-anchor="middle" font-size="9" fill="#555">排除 .last-update.json</text>

  <!-- Step 6 -->
  <rect x="220" y="158" width="180" height="68" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#7b1fa2">⑥ 构建提示词</text>
  <text x="310" y="198" text-anchor="middle" font-size="9" fill="#555">createSystemPrompt()</text>
  <text x="310" y="213" text-anchor="middle" font-size="9" fill="#555">+ createUserPrompt()</text>
  <text x="310" y="226" text-anchor="middle" font-size="9" fill="#555">init / update / chat 分支</text>

  <!-- Step 7 -->
  <rect x="420" y="158" width="180" height="68" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#00695c">⑦ 创建模型客户端</text>
  <text x="510" y="198" text-anchor="middle" font-size="9" fill="#555">createModel()</text>
  <text x="510" y="213" text-anchor="middle" font-size="9" fill="#555">12 个 provider 分支</text>
  <text x="510" y="226" text-anchor="middle" font-size="9" fill="#555">ChatAnthropic/ChatOpenAI/...</text>

  <!-- Step 8 -->
  <rect x="620" y="158" width="180" height="68" rx="10" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#ff8f00">⑧ 创建 Backend</text>
  <text x="710" y="198" text-anchor="middle" font-size="9" fill="#555">LocalShellBackend</text>
  <text x="710" y="213" text-anchor="middle" font-size="9" fill="#555">virtualMode · 100KB 上限</text>
  <text x="710" y="226" text-anchor="middle" font-size="9" fill="#555">120s 超时 · SQLite 检查点</text>

  <!-- arrows row 2 -->
  <line x1="200" y1="192" x2="218" y2="192" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="192" x2="418" y2="192" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="192" x2="618" y2="192" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row connectors (Step 4 → 5 snake) -->
  <line x1="710" y1="133" x2="710" y2="148" stroke="#666" stroke-width="1"/>
  <line x1="710" y1="148" x2="110" y2="148" stroke="#666" stroke-width="1"/>
  <line x1="110" y1="148" x2="110" y2="156" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Row 3: Steps 9-10 -->
  <!-- Step 9 -->
  <rect x="100" y="255" width="300" height="92" rx="12" fill="#0f3460" filter="url(#shadow)"/>
  <text x="250" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">⑨ 流式执行 Agent</text>
  <text x="250" y="299" text-anchor="middle" font-size="10" fill="#aac">DeepAgents 执行 · 模型推理 · 工具调用</text>
  <text x="250" y="314" text-anchor="middle" font-size="10" fill="#aac">事件流式推回 CLI · parseStreamEvent()</text>
  <text x="250" y="329" text-anchor="middle" font-size="9" fill="#aac">Chat: 持久 checkpointer</text>
  <text x="250" y="341" text-anchor="middle" font-size="9" fill="#aac">Init/Update: 内存 checkpointer</text>

  <!-- Step 10 -->
  <rect x="440" y="255" width="280" height="92" rx="12" fill="#1b4332" filter="url(#shadow)"/>
  <text x="580" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">⑩ 快照对比 &amp; 持久化</text>
  <text x="580" y="299" text-anchor="middle" font-size="10" fill="#a0d0b0">persistRunMetadataIfChanged()</text>
  <text x="580" y="314" text-anchor="middle" font-size="10" fill="#a0d0b0">前 SHA-256 vs 后 SHA-256</text>
  <text x="580" y="329" text-anchor="middle" font-size="9" fill="#a0d0b0">仅内容变化时写 .last-update.json</text>

  <!-- arrows between 9 and 10 -->
  <line x1="400" y1="300" x2="438" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom: Output -->
  <rect x="140" y="370" width="540" height="50" rx="10" fill="#333" filter="url(#shadow)"/>
  <text x="410" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#ddd">openwiki/（Code Mode）或 ~/.openwiki/wiki/（Personal Mode）</text>
  <text x="410" y="410" text-anchor="middle" font-size="10" fill="#aaa">结构化的 Markdown 文档 + .last-update.json 元数据</text>

  <line x1="410" y1="347" x2="410" y2="368" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Snapshot branch for step 5→10 -->
  <rect x="20" y="405" width="160" height="50" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1" filter="url(#shadow)"/>
  <text x="100" y="425" text-anchor="middle" font-size="9" font-weight="700" fill="#3f51b5">Step 5 的 SHA-256</text>
  <text x="100" y="442" text-anchor="middle" font-size="9" fill="#555">作为比较基准</text>

  <line x1="100" y1="226" x2="100" y2="403" stroke="#3f51b5" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="100" y1="430" x2="240" y2="430" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="430" x2="240" y2="390" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Bottom notes -->
  <rect x="160" y="475" width="500" height="55" rx="10" fill="#fff8e1" stroke="#f0c000" stroke-width="1"/>
  <text x="410" y="496" text-anchor="middle" font-size="10" font-weight="700" fill="#856404">三个命令的差异化行为</text>
  <text x="410" y="512" text-anchor="middle" font-size="9" fill="#856404">init: 无 .last-update.json → 创建全新文档（上限 8 页）</text>
  <text x="410" y="525" text-anchor="middle" font-size="9" fill="#856404">update: 有 .last-update.json → 基于 Git diff 增量编辑</text>

  <!-- Key legend -->
  <rect x="100" y="550" width="620" height="68" rx="10" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="410" y="568" text-anchor="middle" font-size="10" font-weight="700" fill="#555">chat: 无快照无元数据 · 持久 checkpointer · 支持多轮对话</text>
  <text x="410" y="583" text-anchor="middle" font-size="9" fill="#888">Git 证据策略：git log &lt;lastHead&gt;..HEAD → --since &lt;updatedAt&gt; → --max-count=20</text>
  <text x="410" y="597" text-anchor="middle" font-size="9" fill="#888">可配置的重试次数 · Provider 最终错误直接抛出不切换 · Telemetry 记录运行结果</text>

  <text x="410" y="640" text-anchor="middle" font-size="9" fill="#bbb">agent/index.ts (1637 行) · agent/prompt.ts (473 行) · agent/utils.ts (479 行)</text>
</svg>
